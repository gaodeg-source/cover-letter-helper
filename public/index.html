<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover Letter Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 0.4rem;
      color: #555;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #333;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #1a1a1a;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
      background: #fff;
    }

    textarea { resize: vertical; line-height: 1.5; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }

    /* Resume toggle */
    .resume-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      padding: 0.375rem 0.875rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f5f4f0;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
    }

    .tab-btn.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .resume-panel { display: none; }
    .resume-panel.active { display: block; }

    /* PDF drop zone */
    .drop-zone {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      background: #fafafa;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #1a1a1a;
      background: #f0efec;
    }

    .drop-zone input[type="file"] { display: none; }

    .drop-zone .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .drop-zone p { font-size: 0.875rem; color: #666; }
    .drop-zone p span { color: #1a1a1a; font-weight: 600; text-decoration: underline; }

    .file-name {
      margin-top: 0.75rem;
      font-size: 0.82rem;
      color: #333;
      background: #eee;
      display: inline-block;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
    }

    /* Tone pills */
    .tone-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tone-pill {
      padding: 0.375rem 1rem;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      background: #f5f4f0;
      color: #555;
      transition: all 0.15s;
      user-select: none;
    }

    .tone-pill.selected {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    input[type="hidden"] { display: none; }

    /* Generate button */
    .btn-generate {
      width: 100%;
      padding: 0.875rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn-generate:hover { background: #333; }
    .btn-generate:active { transform: scale(0.99); }
    .btn-generate:disabled { background: #aaa; cursor: not-allowed; }

    /* Loading */
    .loading {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem;
      background: #f5f4f0;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #555;
      margin-top: 1rem;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #ddd;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    .result-card {
      display: none;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 1.75rem;
      margin-top: 1.25rem;
    }

    .result-card.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .result-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
    }

    .result-actions { display: flex; gap: 0.5rem; }

    .btn-sm {
      padding: 0.35rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: #f5f4f0;
      color: #333;
      transition: all 0.15s;
    }

    .btn-sm:hover { background: #e8e8e4; }
    .btn-sm.copied { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    .cover-letter-text {
      font-size: 0.925rem;
      line-height: 1.75;
      color: #1a1a1a;
      white-space: pre-wrap;
    }

    .word-count {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #aaa;
      text-align: right;
    }

    .word-count span {
      font-weight: 600;
      color: #555;
    }

    .error-msg {
      display: none;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 0.875rem 1rem;
      color: #b91c1c;
      font-size: 0.875rem;
      margin-top: 1rem;
    }

    .error-msg.visible { display: block; }

    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Cover Letter Agent</h1>
      <p>Paste your resume and a job description — get a tailored cover letter in seconds.</p>
    </header>

    <form id="form">
      <!-- Resume -->
      <div class="card">
        <h2>Your Resume</h2>
        <div class="resume-tabs">
          <button type="button" class="tab-btn active" data-tab="text">Paste text</button>
          <button type="button" class="tab-btn" data-tab="pdf">Upload PDF</button>
        </div>

        <div class="resume-panel active" id="panel-text">
          <textarea name="resume_text" rows="8" placeholder="Paste your resume here…"></textarea>
        </div>

        <div class="resume-panel" id="panel-pdf">
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="pdf-input" accept=".pdf" />
            <div class="icon">📄</div>
            <p>Drop your PDF here or <span onclick="document.getElementById('pdf-input').click()">browse</span></p>
            <div class="file-name" id="file-name" style="display:none"></div>
          </div>
        </div>
      </div>

      <!-- Job details -->
      <div class="card">
        <h2>Job Details</h2>
        <div class="row">
          <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="e.g. Stripe" required />
          </div>
          <div class="field">
            <label for="role">Role</label>
            <input type="text" id="role" name="role" placeholder="e.g. Software Engineer" required />
          </div>
        </div>
        <div class="field" style="margin-top:1rem">
          <label for="job_description">Job Description</label>
          <textarea id="job_description" name="job_description" rows="8" placeholder="Paste the full job description here…" required></textarea>
        </div>
      </div>

      <!-- Tone -->
      <div class="card">
        <h2>Tone</h2>
        <div class="tone-group" id="tone-group">
          <div class="tone-pill selected" data-tone="startup">Startup</div>
          <div class="tone-pill" data-tone="formal">Formal</div>
          <div class="tone-pill" data-tone="product-focused">Product-focused</div>
          <div class="tone-pill" data-tone="technical">Technical</div>
        </div>
        <input type="hidden" name="tone" id="tone-input" value="startup" />
      </div>

      <button type="submit" class="btn-generate" id="generate-btn">Generate Cover Letter</button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Writing your cover letter…</span>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="result-card" id="result-card">
      <div class="result-header">
        <h2>Cover Letter</h2>
        <div class="result-actions">
          <button class="btn-sm" id="copy-btn">Copy</button>
          <button class="btn-sm" id="retry-btn">Regenerate</button>
        </div>
      </div>
      <div class="cover-letter-text" id="cover-letter-text"></div>
      <div class="word-count">Words: <span id="word-count">0</span> / 350</div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".resume-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
      });
    });

    // PDF drop zone
    const dropZone = document.getElementById("drop-zone");
    const pdfInput = document.getElementById("pdf-input");
    const fileNameEl = document.getElementById("file-name");

    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file?.type === "application/pdf") setFile(file);
    });

    pdfInput.addEventListener("change", () => {
      if (pdfInput.files[0]) setFile(pdfInput.files[0]);
    });

    function setFile(file) {
      pdfInput._file = file;
      fileNameEl.textContent = file.name;
      fileNameEl.style.display = "inline-block";
    }

    // Tone pills
    document.querySelectorAll(".tone-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".tone-pill").forEach(p => p.classList.remove("selected"));
        pill.classList.add("selected");
        document.getElementById("tone-input").value = pill.dataset.tone;
      });
    });

    // Form submit
    const form = document.getElementById("form");
    const generateBtn = document.getElementById("generate-btn");
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("error-msg");
    const resultCard = document.getElementById("result-card");
    const coverLetterText = document.getElementById("cover-letter-text");
    const wordCountEl = document.getElementById("word-count");
    const copyBtn = document.getElementById("copy-btn");
    const retryBtn = document.getElementById("retry-btn");

    async function generate() {
      errorMsg.classList.remove("visible");
      resultCard.classList.remove("visible");
      loading.classList.add("visible");
      generateBtn.disabled = true;

      const fd = new FormData(form);

      // Attach PDF file if in PDF tab and file selected
      const pdfTab = document.querySelector('[data-tab="pdf"]');
      if (pdfTab.classList.contains("active") && pdfInput._file) {
        fd.set("resume_pdf", pdfInput._file);
        fd.delete("resume_text");
      }

      try {
        const res = await fetch("/generate", { method: "POST", body: fd });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Unknown error");

        coverLetterText.textContent = data.cover_letter;
        wordCountEl.textContent = data.word_count;
        resultCard.classList.add("visible");
        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("visible");
      } finally {
        loading.classList.remove("visible");
        generateBtn.disabled = false;
      }
    }

    form.addEventListener("submit", e => { e.preventDefault(); generate(); });
    retryBtn.addEventListener("click", generate);

    // Copy
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(coverLetterText.textContent).then(() => {
        copyBtn.textContent = "Copied!";
        copyBtn.classList.add("copied");
        setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 2000);
      });
    });
  </script>
</body>
</html>
